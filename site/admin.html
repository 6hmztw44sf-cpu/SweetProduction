
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweet Production – Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f3f3;
  color:#111;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  color:#fff;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header strong{
  letter-spacing:.05em;
}

button{
  border:0;
  background:#111;
  color:#fff;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
}

header button{
  background:#fff;
  color:#111;
}

main{
  max-width:900px;
  margin:auto;
  padding:30px 20px 100px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:25px;
}

.toolbar button{
  background:#fff;
  color:#111;
  border:1px solid #ddd;
}

.block{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  overflow:hidden;
}

.block.dragging{
  opacity:.4;
}

.block-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:grab;
}

.drag{
  font-size:20px;
  color:#999;
}

.block-head strong{
  flex:1;
}

.block-body{
  padding:18px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  margin-bottom:15px;
  font:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.delete{
  background:#ddd;
  color:#111;
}

.project{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:10px;
}

.project-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.status{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:50;
}

.error{
  background:#8b0000;
}

.settings{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.settings h2{
  margin-top:0;
  font-size:18px;
}

@media(max-width:600px){
  main{
    padding:20px 12px 80px;
  }

  header{
    padding:15px;
  }

  header strong{
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <strong>SWEET PRODUCTION — ADMIN</strong>
  <button onclick="save()">Spara</button>
</header>

<main>

  <section class="settings">
    <h2>Design</h2>

    <label>Bakgrund</label>
    <input
      type="color"
      id="bgColor"
      onchange="updateSetting('bgColor',this.value)"
    >

    <label>Text</label>
    <input
      type="color"
      id="textColor"
      onchange="updateSetting('textColor',this.value)"
    >

    <label>Accent</label>
    <input
      type="color"
      id="accentColor"
      onchange="updateSetting('accentColor',this.value)"
    >
  </section>

  <div class="toolbar">
    <button onclick="addBlock('hero')">+ Hero</button>
    <button onclick="addBlock('statement')">+ Statement</button>
    <button onclick="addBlock('text')">+ Text</button>
    <button onclick="addBlock('image')">+ Bild</button>
    <button onclick="addBlock('video')">+ Video</button>
    <button onclick="addBlock('projects')">+ Projekt</button>
    <button onclick="addBlock('about')">+ About</button>
    <button onclick="addBlock('contact')">+ Contact</button>
  </div>

  <div id="blocks"></div>

</main>

<div id="status" class="status"></div>

<script>

let content = {
  settings:{
    bgColor:"#080808",
    textColor:"#f1efe9",
    accentColor:"#f1efe9",
    headingFont:"Arial",
    bodyFont:"Arial",
    customFonts:[]
  },
  blocks:[]
};

let dragged = null;

const API = "https://sweetproduction-admin.frycts5yrr.workers.dev/content";

function makeId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showStatus(message,error=false){

  const el=document.getElementById("status");

  el.textContent=message;
  el.classList.toggle("error",error);
  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },3500);
}

function input(label,value,callback){

  return `
    <label>${esc(label)}</label>
    <input
      value="${esc(value)}"
      oninput="${callback},this.value)"
    >
  `;
}

function textarea(label,value,callback){

  return `
    <label>${esc(label)}</label>
    <textarea
      oninput="${callback}(this.value)"
    >${esc(value)}</textarea>
  `;
}

function updateSetting(key,value){

  content.settings[key]=value;
}

function update(i,key,value){

  content.blocks[i][key]=value;
}

function updateProject(i,p,key,value){

  content.blocks[i].projects[p][key]=value;
}

function fields(block,i){

  if(block.type==="hero"){
    return `
      ${input("Plats",block.location||"",
        `update(${i},'location'`)}

      ${textarea("Rubrik",block.title||"",
        `update(${i},'title'`)}
    `;
  }

  if(block.type==="statement"){
    return textarea(
      "Text",
      block.text||"",
      `update(${i},'text'`
    );
  }

  if(block.type==="text"){
    return textarea(
      "Text",
      block.text||"",
      `update(${i},'text'`
    );
  }

  if(block.type==="image"){
    return `
      ${input(
        "Bild URL",
        block.src||"",
        `update(${i},'src'`
      )}

      ${input(
        "Alt-text",
        block.alt||"",
        `update(${i},'alt'`
      )}
    `;
  }

  if(block.type==="video"){
    return `
      <label>Format</label>

      <select onchange="update(${i},'ratio',this.value)">
        <option value="16:9"
          ${block.ratio==="16:9"?"selected":""}>
          16:9
        </option>

        <option value="9:16"
          ${block.ratio==="9:16"?"selected":""}>
          9:16
        </option>
      </select>

      ${input(
        "Video URL",
        block.src||"",
        `update(${i},'src'`
      )}

      ${input(
        "Poster URL",
        block.poster||"",
        `update(${i},'poster'`
      )}
    `;
  }

  if(block.type==="projects"){

    let html=`
      ${input(
        "Rubrik",
        block.title||"",
        `update(${i},'title'`
      )}

      <hr>
    `;

    (block.projects||[]).forEach((p,pi)=>{

      html+=`
        <div class="project">

          <div class="project-head">
            <strong>Projekt ${pi+1}</strong>

            <button
              class="delete"
              onclick="deleteProject(${i},${pi})">
              Ta bort
            </button>
          </div>

          ${input(
            "Titel",
            p.title||"",
            `updateProject(${i},${pi},'title'`
          )}

          ${input(
            "Kategori",
            p.category||"",
            `updateProject(${i},${pi},'category'`
          )}

          ${input(
            "Bild / Video URL",
            p.image||"",
            `updateProject(${i},${pi},'image'`
          )}

          <label>Media</label>

          <select
            onchange="updateProject(${i},${pi},'type',this.value)">
            <option value="image"
              ${p.type==="image"?"selected":""}>
              Bild
            </option>

            <option value="video"
              ${p.type==="video"?"selected":""}>
              Video
            </option>
          </select>

        </div>
      `;
    });

    html+=`
      <button onclick="addProject(${i})">
        + Lägg till projekt
      </button>
    `;

    return html;
  }

  if(block.type==="about"){
    return `
      ${textarea(
        "Rubrik",
        block.title||"",
        `update(${i},'title'`
      )}

      ${textarea(
        "Text",
        block.text||"",
        `update(${i},'text'`
      )}
    `;
  }

  if(block.type==="contact"){
    return `
      ${textarea(
        "Rubrik",
        block.title||"",
        `update(${i},'title'`
      )}

      ${input(
        "E-post",
        block.email||"",
        `update(${i},'email'`
      )}
    `;
  }

  return "";
}

function render(){

  document.getElementById("bgColor").value =
    content.settings.bgColor || "#080808";

  document.getElementById("textColor").value =
    content.settings.textColor || "#f1efe9";

  document.getElementById("accentColor").value =
    content.settings.accentColor || "#f1efe9";

  const root=document.getElementById("blocks");

  root.innerHTML="";

  content.blocks.forEach((block,index)=>{

    const el=document.createElement("div");

    el.className="block";
    el.draggable=true;

    el.addEventListener("dragstart",()=>{
      dragged=index;
      el.classList.add("dragging");
    });

    el.addEventListener("dragend",()=>{
      dragged=null;
      el.classList.remove("dragging");
    });

    el.addEventListener("dragover",e=>{
      e.preventDefault();
    });

    el.addEventListener("drop",e=>{

      e.preventDefault();

      if(dragged===null || dragged===index) return;

      const moved=content.blocks.splice(dragged,1)[0];

      content.blocks.splice(index,0,moved);

      dragged=null;

      render();
    });

    el.innerHTML=`
      <div class="block-head">

        <span class="drag">☰</span>

        <strong>${esc(block.type)}</strong>

        <button onclick="duplicateBlock(${index})">
          Duplicera
        </button>

        <button
          class="delete"
          onclick="deleteBlock(${index})">
          Ta bort
        </button>

      </div>

      <div class="block-body">
        ${fields(block,index)}
      </div>
    `;

    root.appendChild(el);
  });
}

function addProject(i){

  if(!content.blocks[i].projects)
    content.blocks[i].projects=[];

  content.blocks[i].projects.push({
    id:makeId(),
    title:"Nytt projekt",
    category:"Film / Content",
    image:"",
    type:"image"
  });

  render();
}

function deleteProject(i,p){

  content.blocks[i].projects.splice(p,1);

  render();
}

function addBlock(type){

  const block={
    id:makeId(),
    type
  };

  if(type==="hero"){
    block.location="Stockholm · Sweden";
    block.title="Ny rubrik";
  }

  if(type==="statement"){
    block.text="Ny statement";
  }

  if(type==="text"){
    block.text="Ny text";
  }

  if(type==="image"){
    block.src="";
    block.alt="";
  }

  if(type==="video"){
    block.ratio="16:9";
    block.src="";
    block.poster="";
  }

  if(type==="projects"){
    block.title="Selected work";
    block.projects=[];
  }

  if(type==="about"){
    block.title="We create\nvisual stories.";
    block.text="";
  }

  if(type==="contact"){
    block.title="Let's make\nsomething sweet.";
    block.email="hello@sweetproduction.se";
  }

  content.blocks.push(block);

  render();
}

function deleteBlock(i){

  if(!confirm("Ta bort blocket?")) return;

  content.blocks.splice(i,1);

  render();
}

function duplicateBlock(i){

  const copy=JSON.parse(
    JSON.stringify(content.blocks[i])
  );

  copy.id=makeId();

  content.blocks.splice(i+1,0,copy);

  render();
}

async function load(){

  try{

    const response=await fetch(API,{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error(
        "Servern svarade HTTP "+response.status
      );
    }

    content=await response.json();

    render();

  }catch(error){

    console.error(error);

    showStatus(
      "Kunde inte läsa innehållet: "+error.message,
      true
    );
  }
}

async function save(){

  try{

    const response=await fetch(API,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(content)
    });

    const result=await response.json();

    if(!response.ok){
      throw new Error(
        result.error || "Kunde inte spara"
      );
    }

    showStatus("Sparat på hemsidan ✓");

  }catch(error){

    console.error(error);

    showStatus(
      "Kunde inte spara: "+error.message,
      true
    );
  }
}

load();

</script>

</body>
</html>
```
