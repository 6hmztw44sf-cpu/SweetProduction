<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sweet Production – Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f3f3;
  color:#111;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header strong{
  letter-spacing:.05em;
}

.header-actions{
  display:flex;
  gap:8px;
}

button{
  border:0;
  background:#111;
  color:white;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  opacity:.8;
}

header button{
  background:white;
  color:#111;
}

button.secondary{
  background:white;
  color:#111;
  border:1px solid #ddd;
}

button.delete{
  background:#ddd;
  color:#111;
}

main{
  max-width:1000px;
  margin:auto;
  padding:30px 20px 120px;
}

.settings{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:20px;
  margin-bottom:25px;
}

.settings h2{
  margin-top:0;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:25px;
}

.toolbar button{
  background:white;
  color:#111;
  border:1px solid #ddd;
}

.block{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  overflow:hidden;
}

.block.dragging{
  opacity:.35;
}

.block.drag-over{
  border:2px dashed #111;
}

.block-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:grab;
}

.drag{
  font-size:20px;
  color:#999;
}

.block-head strong{
  flex:1;
}

.block-body{
  padding:18px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  margin-bottom:15px;
  font:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input[type="color"]{
  height:45px;
  padding:4px;
}

.project{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:10px;
}

.project-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
  border:1px dashed #ccc;
  border-radius:10px;
}

.status{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:500;
}

@media(max-width:700px){

  header{
    padding:15px;
  }

  header strong{
    font-size:12px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

  main{
    padding:20px 12px 100px;
  }

  .block-head{
    flex-wrap:wrap;
  }

}

</style>

</head>

<body>

<header>

<strong>SWEET PRODUCTION — ADMIN</strong>

<div class="header-actions">

<button
class="secondary"
onclick="loadFromWorker()">
Ladda </button>

<button onclick="saveToWorker()">
  Spara
</button>

</div>

</header>

<main>

<section class="settings">

<h2>Site settings</h2>

<div class="settings-grid">

<div>

<label>Bakgrund</label>

<input
id="bgColor"
type="color"
onchange="updateSetting('bgColor',this.value)">

</div>

<div>

<label>Text</label>

<input
id="textColor"
type="color"
onchange="updateSetting('textColor',this.value)">

</div>

<div>

<label>Accent</label>

<input
id="accentColor"
type="color"
onchange="updateSetting('accentColor',this.value)">

</div>

<div>

<label>Heading font</label>

<input
id="headingFont"
oninput="updateSetting('headingFont',this.value)">

</div>

<div>

<label>Body font</label>

<input
id="bodyFont"
oninput="updateSetting('bodyFont',this.value)">

</div>

</div>

</section>

<div class="toolbar">

<button onclick="addBlock('hero')">
+ Hero
</button>

<button onclick="addBlock('statement')">
+ Statement
</button>

<button onclick="addBlock('text')">
+ Text
</button>

<button onclick="addBlock('image')">
+ Bild
</button>

<button onclick="addBlock('video')">
+ Video
</button>

<button onclick="addBlock('projects')">
+ Projektsektion
</button>

<button onclick="addBlock('about')">
+ About
</button>

<button onclick="addBlock('contact')">
+ Contact
</button>

</div>

<div id="blocks"></div>

</main>

<div id="status" class="status"></div>

<script>

const API=
  "https://sweetproduction-admin.frycts5yrr.workers.dev";


let content={

  settings:{
    bgColor:"#080808",
    textColor:"#f1efe9",
    accentColor:"#f1efe9",
    headingFont:"Arial",
    bodyFont:"Arial",
    customFonts:[]
  },

  blocks:[]

};


let draggedIndex=null;


/* =========================
   HELPERS
========================= */

function createId(){

  return Date.now().toString(36)
    +Math.random().toString(36).slice(2);

}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showStatus(message){

  const el=
    document.getElementById("status");

  el.textContent=message;

  el.style.display="block";

  setTimeout(()=>{

    el.style.display="none";

  },2500);

}


/* =========================
   LOAD
========================= */

async function loadFromWorker(){

  try{

    showStatus("Laddar...");


    const response=
      await fetch(
        API+"/content",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data=
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Kunde inte ladda innehållet."
      );

    }


    content=data.content;


    render();


    showStatus(
      "Laddat från GitHub ✓"
    );

  }

  catch(error){

    console.error(error);

    alert(
      "Kunde inte ladda:\n\n"
      +error.message
    );

  }

}


/* =========================
   SAVE
========================= */

async function saveToWorker(){

  try{

    showStatus(
      "Sparar till GitHub..."
    );


    const response=
      await fetch(
        API+"/content",
        {

          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            content:content
          })

        }
      );


    const data=
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Kunde inte spara."
      );

    }


    showStatus(
      "Sparat till GitHub ✓"
    );

  }

  catch(error){

    console.error(error);

    alert(
      "Kunde inte spara:\n\n"
      +error.message
    );

  }

}


/* =========================
   SETTINGS
========================= */

function updateSetting(
  key,
  value
){

  content.settings[key]=value;

}


/* =========================
   INPUTS
========================= */

function input(
  label,
  value,
  callback
){

  return `

    <label>${label}</label>

    <input
      value="${esc(value)}"
      oninput="${callback}(this.value)"
    >

  `;

}


function textarea(
  label,
  value,
  callback
){

  return `

    <label>${label}</label>

    <textarea
      oninput="${callback}(this.value)"
    >${esc(value)}</textarea>

`;

}

/* =========================
FIELDS
========================= */

function fields(
block,
i
){

if(block.type==="hero"){

```
return `

  ${input(
    "Plats",
    block.location || "",
    `update(${i},'location'`
  )}

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

`;
```

}

if(block.type==="statement"){

```
return textarea(
  "Text",
  block.text || "",
  `update(${i},'text'`
);
```

}

if(block.type==="text"){

```
return textarea(
  "Text",
  block.text || "",
  `update(${i},'text'`
);
```

}

if(block.type==="image"){

```
return `

  ${input(
    "Bild URL",
    block.src || "",
    `update(${i},'src'`
  )}

  ${input(
    "Alt-text",
    block.alt || "",
    `update(${i},'alt'`
  )}

`;
```

}

if(block.type==="video"){

```
return `

  <label>Format</label>

  <select
    onchange="
      update(
        ${i},
        'ratio',
        this.value
      )
    "
  >

    <option
      value="16:9"
      ${block.ratio==="16:9"?"selected":""}>
      16:9
    </option>

    <option
      value="9:16"
      ${block.ratio==="9:16"?"selected":""}>
      9:16
    </option>

  </select>


  ${input(
    "Video URL",
    block.src || "",
    `update(${i},'src'`
  )}


  ${input(
    "Poster URL",
    block.poster || "",
    `update(${i},'poster'`
  )}

`;
```

}

if(block.type==="projects"){

```
let html=`

  ${input(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

  <hr>

`;


(block.projects || [])
  .forEach(
    (project,pi)=>{

      html+=`

        <div class="project">

          <div class="project-head">

            <strong>
              Projekt ${pi+1}
            </strong>

            <button
              class="delete"
              onclick="
                deleteProject(
                  ${i},
                  ${pi}
                )
              ">

              Ta bort

            </button>

          </div>


          ${input(
            "Titel",
            project.title || "",
            `updateProject(
              ${i},
              ${pi},
              'title'`
          )}


          ${input(
            "Kategori",
            project.category || "",
            `updateProject(
              ${i},
              ${pi},
              'category'`
          )}


          ${input(
            "Bild / Video URL",
            project.image || "",
            `updateProject(
              ${i},
              ${pi},
              'image'`
          )}


          <label>Media</label>

          <select
            onchange="
              updateProject(
                ${i},
                ${pi},
                'type',
                this.value
              )
            "
          >

            <option
              value="image"
              ${project.type==="image"?"selected":""}>
              Bild
            </option>

            <option
              value="video"
              ${project.type==="video"?"selected":""}>
              Video
            </option>

          </select>

        </div>

      `;

    }
  );


html+=`

  <button
    onclick="addProject(${i})">
    + Lägg till projekt
  </button>

`;


return html;
```

}

if(block.type==="about"){

```
return `

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

  ${textarea(
    "Text",
    block.text || "",
    `update(${i},'text'`
  )}

`;
```

}

if(block.type==="contact"){

```
return `

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

  ${input(
    "E-post",
    block.email || "",
    `update(${i},'email'`
  )}

`;
```

}

return "";

}

/* =========================
RENDER
========================= */

function render(){

const settings=
content.settings || {};

document.getElementById(
"bgColor"
).value=
settings.bgColor ||
"#080808";

document.getElementById(
"textColor"
).value=
settings.textColor ||
"#f1efe9";

document.getElementById(
"accentColor"
).value=
settings.accentColor ||
"#f1efe9";

document.getElementById(
"headingFont"
).value=
settings.headingFont ||
"Arial";

document.getElementById(
"bodyFont"
).value=
settings.bodyFont ||
"Arial";

const root=
document.getElementById(
"blocks"
);

root.innerHTML="";

if(
!content.blocks ||
!content.blocks.length
){

```
root.innerHTML=`

  <div class="empty">

    Inga block ännu.<br>
    Lägg till ett block ovan.

  </div>

`;

return;
```

}

content.blocks.forEach(
(block,index)=>{

```
  const el=
    document.createElement(
      "div"
    );


  el.className="block";

  el.draggable=true;


  el.addEventListener(
    "dragstart",
    ()=>{

      draggedIndex=index;

      el.classList.add(
        "dragging"
      );

    }
  );


  el.addEventListener(
    "dragend",
    ()=>{

      draggedIndex=null;

      el.classList.remove(
        "dragging"
      );

    }
  );


  el.addEventListener(
    "dragover",
    event=>{

      event.preventDefault();

      el.classList.add(
        "drag-over"
      );

    }
  );


  el.addEventListener(
    "dragleave",
    ()=>{

      el.classList.remove(
        "drag-over"
      );

    }
  );


  el.addEventListener(
    "drop",
    event=>{

      event.preventDefault();

      el.classList.remove(
        "drag-over"
      );


      const target=index;


      if(
        draggedIndex===null ||
        draggedIndex===target
      ){

        return;

      }


      const moved=
        content.blocks.splice(
          draggedIndex,
          1
        )[0];


      content.blocks.splice(
        target,
        0,
        moved
      );


      draggedIndex=null;

      render();

    }
  );


  el.innerHTML=`

    <div class="block-head">

      <span class="drag">
        ☰
      </span>

      <strong>
        ${index+1}.
        ${esc(block.type)}
      </strong>

      <button
        class="secondary"
        onclick="
          moveUp(${index})
        ">
        ↑
      </button>

      <button
        class="secondary"
        onclick="
          moveDown(${index})
        ">
        ↓
      </button>

      <button
        class="secondary"
        onclick="
          duplicateBlock(${index})
        ">
        Duplicera
      </button>

      <button
        class="delete"
        onclick="
          deleteBlock(${index})
        ">
        Ta bort
      </button>

    </div>

    <div class="block-body">

      ${fields(
        block,
        index
      )}

    </div>

  `;


  root.appendChild(el);

}
```

);

}

/* =========================
UPDATE
========================= */

function update(
index,
key,
value
){

if(
!content.blocks[index]
){

```
return;
```

}

content.blocks[index][key]=
value;

}

/* =========================
PROJECTS
========================= */

function updateProject(
blockIndex,
projectIndex,
key,
value
){

content.blocks[
blockIndex
].projects[
projectIndex
][key]=value;

}

function addProject(index){

if(
!content.blocks[index].projects
){

```
content.blocks[index].projects=[];
```

}

content.blocks[index].projects.push({

```
id:createId(),

title:"Nytt projekt",

category:
  "Film / Content",

image:"",

type:"image"
```

});

render();

}

function deleteProject(
blockIndex,
projectIndex
){

content.blocks[
blockIndex
].projects.splice(
projectIndex,
1
);

render();

}

/* =========================
BLOCKS
========================= */

function addBlock(type){

const block={
id:createId(),
type:type
};

if(type==="hero"){

```
block.location=
  "Stockholm · Sweden";

block.title=
  "Film.\nFoto.\nContent.";
```

}

if(type==="statement"){

```
block.text=
  "Visuals that\nstay with you.";
```

}

if(type==="text"){

```
block.text=
  "Ny text";
```

}

if(type==="image"){

```
block.src="";
block.alt="";
```

}

if(type==="video"){

```
block.ratio="16:9";
block.src="";
block.poster="";
```

}

if(type==="projects"){

```
block.title=
  "Selected work";

block.projects=[];
```

}

if(type==="about"){

```
block.title=
  "We create\nvisual stories.";

block.text="";
```

}

if(type==="contact"){

```
block.title=
  "Let's make\nsomething sweet.";

block.email=
  "hello@sweetproduction.se";
```

}

content.blocks.push(
block
);

render();

}

function deleteBlock(index){

if(
!confirm(
"Är du säker på att du vill ta bort blocket?"
)
){

```
return;
```

}

content.blocks.splice(
index,
1
);

render();

}

function duplicateBlock(index){

const copy=
JSON.parse(
JSON.stringify(
content.blocks[index]
)
);

copy.id=createId();

if(copy.projects){

```
copy.projects=
  copy.projects.map(
    project=>({

      ...project,

      id:createId()

    })
  );
```

}

content.blocks.splice(
index+1,
0,
copy
);

render();

}

function moveUp(index){

if(index<=0) return;

[
content.blocks[index-1],
content.blocks[index]
]=[
content.blocks[index],
content.blocks[index-1]
];

render();

}

function moveDown(index){

if(
index>=
content.blocks.length-1
){

```
return;
```

}

[
content.blocks[index],
content.blocks[index+1]
]=[
content.blocks[index+1],
content.blocks[index]
];

render();

}

/* =========================
START
========================= */

loadFromWorker();

</script>

</body>

</html>
