<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sweet Production – Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f3f3;
  color:#111;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header strong{
  letter-spacing:.05em;
}

.header-actions{
  display:flex;
  gap:8px;
}

button{
  border:0;
  background:#111;
  color:white;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  opacity:.8;
}

header button{
  background:white;
  color:#111;
}

button.secondary{
  background:white;
  color:#111;
  border:1px solid #ddd;
}

button.delete{
  background:#ddd;
  color:#111;
}

main{
  max-width:1000px;
  margin:auto;
  padding:30px 20px 120px;
}

.github-box,
.settings{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:20px;
  margin-bottom:25px;
}

.github-box{
  background:#fff8df;
  border-color:#eadb9b;
}

.github-box h2,
.settings h2{
  margin-top:0;
}

.github-box p{
  font-size:13px;
  line-height:1.4;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:25px;
}

.block{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  overflow:hidden;
}

.block.dragging{
  opacity:.35;
}

.block.drag-over{
  border:2px dashed #111;
}

.block-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:grab;
}

.drag{
  font-size:20px;
  color:#999;
}

.block-head strong{
  flex:1;
}

.block-body{
  padding:18px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  margin-bottom:15px;
  font:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input[type="color"]{
  height:45px;
  padding:4px;
}

.project{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:10px;
}

.project-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
  border:1px dashed #ccc;
  border-radius:10px;
}

.status{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:500;
}

@media(max-width:700px){

  header{
    padding:15px;
    align-items:flex-start;
  }

  header strong{
    font-size:12px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

  main{
    padding:20px 12px 100px;
  }

  .block-head{
    flex-wrap:wrap;
  }

  .block-head strong{
    min-width:100px;
  }

}

</style>

</head>

<body>

<header>

<strong>SWEET PRODUCTION — ADMIN</strong>

<div class="header-actions">

<button
class="secondary"
onclick="loadFromGitHub()">
Ladda </button>

<button onclick="saveToGitHub()">
  Spara
</button>

</div>

</header>

<main>

<section class="github-box">

<h2>GitHub</h2>

<p>
Dina GitHub-uppgifter sparas endast i den här webbläsaren.
Skicka aldrig tokenen till någon annan.
</p>

<div class="settings-grid">

<div>

<label>Owner</label>

<input
id="githubOwner"
placeholder="GitHub username">

</div>

<div>

<label>Repository</label>

<input
id="githubRepo"
placeholder="Repository name">

</div>

<div>

<label>Branch</label>

<input
id="githubBranch"
value="main">

</div>

<div>

<label>GitHub Token</label>

<input
id="githubToken"
type="password"
placeholder="github_pat_...">

</div>

</div>

</section>

<section class="settings">

<h2>Site settings</h2>

<div class="settings-grid">

<div>

<label>Bakgrund</label>

<input
id="bgColor"
type="color"
onchange="updateSetting('bgColor',this.value)">

</div>

<div>

<label>Text</label>

<input
id="textColor"
type="color"
onchange="updateSetting('textColor',this.value)">

</div>

<div>

<label>Accent</label>

<input
id="accentColor"
type="color"
onchange="updateSetting('accentColor',this.value)">

</div>

<div>

<label>Heading font</label>

<input
id="headingFont"
oninput="updateSetting('headingFont',this.value)">

</div>

<div>

<label>Body font</label>

<input
id="bodyFont"
oninput="updateSetting('bodyFont',this.value)">

</div>

</div>

</section>

<div class="toolbar">

<button onclick="addBlock('hero')">
+ Hero
</button>

<button onclick="addBlock('statement')">
+ Statement
</button>

<button onclick="addBlock('text')">
+ Text
</button>

<button onclick="addBlock('image')">
+ Bild
</button>

<button onclick="addBlock('video')">
+ Video
</button>

<button onclick="addBlock('projects')">
+ Projektsektion
</button>

<button onclick="addBlock('about')">
+ About
</button>

<button onclick="addBlock('contact')">
+ Contact
</button>

</div>

<div id="blocks"></div>

</main>

<div id="status" class="status"></div>

<script>

let content = {

  settings:{
    bgColor:"#080808",
    textColor:"#f1efe9",
    accentColor:"#f1efe9",
    headingFont:"Arial",
    bodyFont:"Arial",
    customFonts:[]
  },

  blocks:[]

};

let draggedIndex=null;


/* =========================
   HELPERS
========================= */

function createId(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2);

}

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function showStatus(message){

  const el=document.getElementById("status");

  el.textContent=message;

  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },2500);

}


/* =========================
   GITHUB SETTINGS
========================= */

function getGitHubSettings(){

  const owner=
    document.getElementById("githubOwner").value.trim();

  const repo=
    document.getElementById("githubRepo").value.trim();

  const branch=
    document.getElementById("githubBranch").value.trim() || "main";

  const token=
    document.getElementById("githubToken").value.trim();

  localStorage.setItem("sweetGithubOwner",owner);
  localStorage.setItem("sweetGithubRepo",repo);
  localStorage.setItem("sweetGithubBranch",branch);
  localStorage.setItem("sweetGithubToken",token);

  return {
    owner,
    repo,
    branch,
    token
  };

}


function loadGitHubSettings(){

  document.getElementById("githubOwner").value=
    localStorage.getItem("sweetGithubOwner") || "";

  document.getElementById("githubRepo").value=
    localStorage.getItem("sweetGithubRepo") || "";

  document.getElementById("githubBranch").value=
    localStorage.getItem("sweetGithubBranch") || "main";

  document.getElementById("githubToken").value=
    localStorage.getItem("sweetGithubToken") || "";

}


/* =========================
   GITHUB API
========================= */

async function githubFetch(url,options={}){

  const token=
    localStorage.getItem("sweetGithubToken");

  const headers={
    "Accept":"application/vnd.github+json",
    "Content-Type":"application/json",
    "X-GitHub-Api-Version":"2022-11-28"
  };

  if(token){
    headers["Authorization"]="Bearer "+token;
  }

  const response=
    await fetch(url,{
      ...options,
      headers
    });

  const text=await response.text();

  let data={};

  try{
    data=JSON.parse(text);
  }catch(e){
    data={message:text};
  }

  if(!response.ok){

    throw new Error(
      data.message ||
      `GitHub returned HTTP ${response.status}`
    );

  }

  return data;

}


/* =========================
   BASE64
========================= */

function encodeBase64Unicode(text){

  const bytes=
    new TextEncoder().encode(text);

  let binary="";

  for(const byte of bytes){

    binary+=String.fromCharCode(byte);

  }

  return btoa(binary);

}


function decodeBase64Unicode(base64){

  const binary=
    atob(base64.replace(/\n/g,""));

  const bytes=
    Uint8Array.from(
      binary,
      char=>char.charCodeAt(0)
    );

  return new TextDecoder().decode(bytes);

}


/* =========================
   LOAD FROM GITHUB
========================= */

async function loadFromGitHub(){

  const settings=getGitHubSettings();

  if(
    !settings.owner ||
    !settings.repo ||
    !settings.token
  ){

    alert(
      "Fyll i Owner, Repository och Token först."
    );

    return;

  }

  try{

    showStatus("Laddar från GitHub...");

    const url=
      "https://api.github.com/repos/"
      +encodeURIComponent(settings.owner)
      +"/"
      +encodeURIComponent(settings.repo)
      +"/contents/site/content.json?ref="
      +encodeURIComponent(settings.branch);


    const data=
      await githubFetch(url);


    content=
      JSON.parse(
        decodeBase64Unicode(data.content)
      );


    render();

    showStatus("Laddat från GitHub ✓");

  }

  catch(error){

    console.error(error);

    alert(
      "Kunde inte ladda från GitHub:\n\n"
      +error.message
    );

  }

}


/* =========================
   SAVE TO GITHUB
========================= */

async function saveToGitHub(){

  const settings=getGitHubSettings();

  if(
    !settings.owner ||
    !settings.repo ||
    !settings.token
  ){

    alert(
      "Fyll i Owner, Repository och Token först."
    );

    return;

  }


  try{

    showStatus("Hämtar aktuell fil...");


    /*
      Först hämtar vi aktuell content.json.
      Det ger oss SHA:n som GitHub kräver
      när en befintlig fil ska uppdateras.
    */

    const fileUrl=
      "https://api.github.com/repos/"
      +encodeURIComponent(settings.owner)
      +"/"
      +encodeURIComponent(settings.repo)
      +"/contents/site/content.json";


    const current=
      await githubFetch(
        fileUrl
        +"?ref="
        +encodeURIComponent(settings.branch)
      );


    /*
      Gör JSON snyggt formaterad.
    */

    const json=
      JSON.stringify(
        content,
        null,
        2
      );


    const encoded=
      encodeBase64Unicode(json);


    showStatus("Skriver till GitHub...");


    /*
      PUT = uppdatera befintlig fil.
    */

    const result=
      await githubFetch(
        fileUrl,
        {

          method:"PUT",

          body:JSON.stringify({

            message:
              "Update website content",

            content:
              encoded,

            sha:
              current.sha,

            branch:
              settings.branch

          })

        }
      );


    console.log(
      "GitHub commit:",
      result
    );


    showStatus(
      "Sparat till GitHub ✓"
    );


  }

  catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    alert(
      "Kunde inte spara till GitHub:\n\n"
      +error.message
      +"\n\n"
      +"Kontrollera att tokenen har "
      +"Contents → Read and write."
    );

  }

}


/* =========================
   SITE SETTINGS
========================= */

function updateSetting(key,value){

  content.settings[key]=value;

}


/* =========================
   INPUT HELPERS
========================= */

function input(label,value,callback){

  return `

    <label>${label}</label>

    <input
      value="${esc(value)}"
      oninput="${callback}(this.value)"
    >

  `;

}


function textarea(label,value,callback){

  return `

    <label>${label}</label>

    <textarea
      oninput="${callback}(this.value)"
    >${esc(value)}</textarea>

`;

}

/* =========================
BLOCK FIELDS
========================= */

function fields(block,i){

if(block.type==="hero"){

```
return `

  ${input(
    "Plats",
    block.location || "",
    `update(${i},'location'`
  )}

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

`;
```

}

if(block.type==="statement"){

```
return textarea(
  "Text",
  block.text || "",
  `update(${i},'text'`
);
```

}

if(block.type==="text"){

```
return textarea(
  "Text",
  block.text || "",
  `update(${i},'text'`
);
```

}

if(block.type==="image"){

```
return `

  ${input(
    "Bild URL",
    block.src || "",
    `update(${i},'src'`
  )}

  ${input(
    "Alt-text",
    block.alt || "",
    `update(${i},'alt'`
  )}

`;
```

}

if(block.type==="video"){

```
return `

  <label>Format</label>

  <select
    onchange="
      update(
        ${i},
        'ratio',
        this.value
      )
    "
  >

    <option
      value="16:9"
      ${block.ratio==="16:9"?"selected":""}>

      16:9

    </option>

    <option
      value="9:16"
      ${block.ratio==="9:16"?"selected":""}>

      9:16

    </option>

  </select>


  ${input(
    "Video URL",
    block.src || "",
    `update(${i},'src'`
  )}


  ${input(
    "Poster URL",
    block.poster || "",
    `update(${i},'poster'`
  )}

`;
```

}

if(block.type==="projects"){

```
let html=`


  ${input(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}


  <hr>

`;


(block.projects || [])
  .forEach((project,pi)=>{

    html+=`

      <div class="project">

        <div class="project-head">

          <strong>
            Projekt ${pi+1}
          </strong>

          <button
            class="delete"
            onclick="
              deleteProject(${i},${pi})
            ">

            Ta bort

          </button>

        </div>


        ${input(
          "Titel",
          project.title || "",
          `updateProject(${i},${pi},'title'`
        )}


        ${input(
          "Kategori",
          project.category || "",
          `updateProject(${i},${pi},'category'`
        )}


        ${input(
          "Bild / Video URL",
          project.image || "",
          `updateProject(${i},${pi},'image'`
        )}


        <label>
          Media
        </label>

        <select
          onchange="
            updateProject(
              ${i},
              ${pi},
              'type',
              this.value
            )
          "
        >

          <option
            value="image"
            ${project.type==="image"?"selected":""}>

            Bild

          </option>

          <option
            value="video"
            ${project.type==="video"?"selected":""}>

            Video

          </option>

        </select>

      </div>

    `;

  });


html+=`

  <button onclick="addProject(${i})">
    + Lägg till projekt
  </button>

`;


return html;
```

}

if(block.type==="about"){

```
return `

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

  ${textarea(
    "Text",
    block.text || "",
    `update(${i},'text'`
  )}

`;
```

}

if(block.type==="contact"){

```
return `

  ${textarea(
    "Rubrik",
    block.title || "",
    `update(${i},'title'`
  )}

  ${input(
    "E-post",
    block.email || "",
    `update(${i},'email'`
  )}

`;
```

}

return "";

}

/* =========================
RENDER
========================= */

function render(){

document.getElementById("bgColor").value=
content.settings.bgColor || "#080808";

document.getElementById("textColor").value=
content.settings.textColor || "#f1efe9";

document.getElementById("accentColor").value=
content.settings.accentColor || "#f1efe9";

document.getElementById("headingFont").value=
content.settings.headingFont || "Arial";

document.getElementById("bodyFont").value=
content.settings.bodyFont || "Arial";

const root=
document.getElementById("blocks");

root.innerHTML="";

if(!content.blocks.length){

```
root.innerHTML=`

  <div class="empty">

    Inga block ännu.<br>
    Lägg till ett block ovan.

  </div>

`;

return;
```

}

content.blocks.forEach((block,index)=>{

```
const el=
  document.createElement("div");

el.className="block";

el.draggable=true;


el.addEventListener(
  "dragstart",
  ()=>{
    draggedIndex=index;
    el.classList.add("dragging");
  }
);


el.addEventListener(
  "dragend",
  ()=>{
    draggedIndex=null;
    el.classList.remove("dragging");
  }
);


el.addEventListener(
  "dragover",
  event=>{
    event.preventDefault();
    el.classList.add("drag-over");
  }
);


el.addEventListener(
  "dragleave",
  ()=>{
    el.classList.remove("drag-over");
  }
);


el.addEventListener(
  "drop",
  event=>{

    event.preventDefault();

    el.classList.remove("drag-over");


    const target=index;


    if(
      draggedIndex===null ||
      draggedIndex===target
    ){

      return;

    }


    const moved=
      content.blocks.splice(
        draggedIndex,
        1
      )[0];


    content.blocks.splice(
      target,
      0,
      moved
    );


    draggedIndex=null;

    render();

  }
);


el.innerHTML=`

  <div class="block-head">

    <span class="drag">☰</span>

    <strong>
      ${index+1}. ${esc(block.type)}
    </strong>

    <button
      class="secondary"
      onclick="moveUp(${index})">
      ↑
    </button>

    <button
      class="secondary"
      onclick="moveDown(${index})">
      ↓
    </button>

    <button
      class="secondary"
      onclick="duplicateBlock(${index})">
      Duplicera
    </button>

    <button
      class="delete"
      onclick="deleteBlock(${index})">
      Ta bort
    </button>

  </div>

  <div class="block-body">

    ${fields(block,index)}

  </div>

`;


root.appendChild(el);
```

});

}

/* =========================
UPDATE
========================= */

function update(i,key,value){

if(!content.blocks[i]) return;

content.blocks[i][key]=value;

}

/* =========================
PROJECTS
========================= */

function updateProject(
blockIndex,
projectIndex,
key,
value
){

content.blocks[
blockIndex
].projects[
projectIndex
][key]=value;

}

function addProject(index){

if(!content.blocks[index].projects){

```
content.blocks[index].projects=[];
```

}

content.blocks[index].projects.push({

```
id:createId(),

title:"Nytt projekt",

category:"Film / Content",

image:"",

type:"image"
```

});

render();

}

function deleteProject(
blockIndex,
projectIndex
){

content.blocks[
blockIndex
].projects.splice(
projectIndex,
1
);

render();

}

/* =========================
BLOCKS
========================= */

function addBlock(type){

const block={
id:createId(),
type:type
};

if(type==="hero"){

```
block.location=
  "Stockholm · Sweden";

block.title=
  "Film.\nFoto.\nContent.";
```

}

if(type==="statement"){

```
block.text=
  "Visuals that\nstay with you.";
```

}

if(type==="text"){

```
block.text=
  "Ny text";
```

}

if(type==="image"){

```
block.src="";
block.alt="";
```

}

if(type==="video"){

```
block.ratio="16:9";
block.src="";
block.poster="";
```

}

if(type==="projects"){

```
block.title="Selected work";
block.projects=[];
```

}

if(type==="about"){

```
block.title=
  "We create\nvisual stories.";

block.text="";
```

}

if(type==="contact"){

```
block.title=
  "Let's make\nsomething sweet.";

block.email=
  "hello@sweetproduction.se";
```

}

content.blocks.push(block);

render();

}

function deleteBlock(index){

if(
!confirm(
"Är du säker på att du vill ta bort blocket?"
)
){

```
return;
```

}

content.blocks.splice(index,1);

render();

}

function duplicateBlock(index){

const copy=
JSON.parse(
JSON.stringify(
content.blocks[index]
)
);

copy.id=createId();

if(copy.projects){

```
copy.projects=
  copy.projects.map(project=>({

    ...project,

    id:createId()

  }));
```

}

content.blocks.splice(
index+1,
0,
copy
);

render();

}

function moveUp(index){

if(index<=0) return;

[
content.blocks[index-1],
content.blocks[index]
]=[
content.blocks[index],
content.blocks[index-1]
];

render();

}

function moveDown(index){

if(
index>=content.blocks.length-1
){

```
return;
```

}

[
content.blocks[index],
content.blocks[index+1]
]=[
content.blocks[index+1],
content.blocks[index]
];

render();

}

/* =========================
INITIAL LOAD
========================= */

loadGitHubSettings();

fetch(
"content.json?v="+Date.now()
)

.then(response=>{

if(!response.ok){

```
throw new Error();
```

}

return response.json();

})

.then(data=>{

content=data;

render();

})

.catch(()=>{

render();

});

</script>

</body>

</html>
