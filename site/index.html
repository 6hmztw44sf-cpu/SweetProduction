<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sweet Production</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="nav">

  <a href="#top" class="logo">
    SWEET<span>PRODUCTION</span>
  </a>

  <nav>
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

</header>

<main id="page"></main>

<footer>

  <span>© Sweet Production</span>

  <span>Stockholm, Sweden</span>

</footer>


<script>

const fallback = {

  settings:{
    bgColor:"#080808",
    textColor:"#f1efe9",
    accentColor:"#f1efe9",
    headingFont:"Arial",
    bodyFont:"Arial",
    customFonts:[]
  },

  blocks:[]

};


/* =========================
   SECURITY
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SETTINGS
========================= */

function applySettings(settings){

  const s = settings || fallback.settings;

  document.documentElement.style.setProperty(
    "--bg-color",
    s.bgColor || "#080808"
  );

  document.documentElement.style.setProperty(
    "--text-color",
    s.textColor || "#f1efe9"
  );

  document.documentElement.style.setProperty(
    "--accent-color",
    s.accentColor || "#f1efe9"
  );

  document.documentElement.style.setProperty(
    "--heading-font",
    s.headingFont
      ? `"${s.headingFont}", Arial, sans-serif`
      : "Arial, sans-serif"
  );

  document.documentElement.style.setProperty(
    "--body-font",
    s.bodyFont
      ? `"${s.bodyFont}", Arial, sans-serif`
      : "Arial, sans-serif"
  );


  /* Custom fonts */

  if(Array.isArray(s.customFonts)){

    s.customFonts.forEach((font,index)=>{

      if(!font || !font.name || !font.url) return;

      const style = document.createElement("style");

      style.innerHTML = `
        @font-face{
          font-family:"${esc(font.name)}";
          src:url("${esc(font.url)}") format("woff2");
          font-weight:100 900;
          font-style:normal;
          font-display:swap;
        }
      `;

      style.dataset.fontIndex=index;

      document.head.appendChild(style);

    });

  }

}


/* =========================
   RENDER
========================= */

function render(content){

  applySettings(content.settings);

  const page = document.getElementById("page");

  page.innerHTML = "";


  (content.blocks || []).forEach(block=>{


    /* =========================
       HERO
    ========================= */

    if(block.type === "hero"){

      page.innerHTML += `

        <section class="hero">

          <div class="hero-bg">

            <div class="glow one"></div>
            <div class="glow two"></div>

            <div class="grain"></div>

          </div>

          <div class="hero-content">

            <p class="eyebrow">
              ${esc(block.location)}
            </p>

            <h1>
              ${esc(block.title).replace(/\n/g,"<br>")}
            </h1>

            <a href="#work" class="scroll">
              Scroll to explore ↓
            </a>

          </div>

        </section>

      `;

    }


    /* =========================
       STATEMENT
    ========================= */

    if(block.type === "statement"){

      page.innerHTML += `

        <section class="statement">

          <p class="eyebrow">
            Sweet Production
          </p>

          <h2>
            ${esc(block.text).replace(/\n/g,"<br>")}
          </h2>

        </section>

      `;

    }


    /* =========================
       TEXT
    ========================= */

    if(block.type === "text"){

      page.innerHTML += `

        <section class="custom-text">

          <p>
            ${esc(block.text).replace(/\n/g,"<br>")}
          </p>

        </section>

      `;

    }


    /* =========================
       IMAGE
    ========================= */

    if(block.type === "image" && block.src){

      page.innerHTML += `

        <section class="custom-image">

          <img
            src="${esc(block.src)}"
            alt="${esc(block.alt)}"
            loading="lazy"
          >

        </section>

      `;

    }


    /* =========================
       VIDEO
    ========================= */

    if(block.type === "video" && block.src){

      const ratio =
        block.ratio === "9:16"
          ? "vertical"
          : "landscape";


      page.innerHTML += `

        <section class="custom-video ${ratio}">

          <video
            src="${esc(block.src)}"
            ${block.poster
              ? `poster="${esc(block.poster)}"`
              : ""
            }
            autoplay
            muted
            loop
            playsinline
            controls>
          </video>

        </section>

      `;

    }


    /* =========================
       PROJECTS
    ========================= */

    if(block.type === "projects"){

      let html = "";


      (block.projects || []).forEach(project=>{

        let media = "";


        if(project.type === "video" && project.image){

          media = `

            <video
              src="${esc(project.image)}"
              autoplay
              muted
              loop
              playsinline>
            </video>

          `;

        }

        else if(project.image){

          media = `

            <img
              src="${esc(project.image)}"
              alt="${esc(project.title)}"
              loading="lazy"
            >

          `;

        }

        else{

          media = `
            <div class="empty-media"></div>
          `;

        }


        html += `

          <article class="project">

            <div class="media">
              ${media}
            </div>

            <div class="meta">

              <strong>
                ${esc(project.title)}
              </strong>

              <small>
                ${esc(project.category)}
              </small>

            </div>

          </article>

        `;

      });


      page.innerHTML += `

        <section id="work" class="work">

          <div class="section-top">

            <p class="eyebrow">
              ${esc(block.title)}
            </p>

            <span>
              ${String(
                (block.projects || []).length
              ).padStart(2,"0")}
            </span>

          </div>

          <div class="projects">
            ${html}
          </div>

        </section>

      `;

    }


    /* =========================
       ABOUT
    ========================= */

    if(block.type === "about"){

      page.innerHTML += `

        <section id="about" class="about">

          <p class="eyebrow">
            About
          </p>

          <h2>
            ${esc(block.title).replace(/\n/g,"<br>")}
          </h2>

          <p class="about-text">
            ${esc(block.text).replace(/\n/g,"<br>")}
          </p>

        </section>

      `;

    }


    /* =========================
       CONTACT
    ========================= */

    if(block.type === "contact"){

      page.innerHTML += `

        <section id="contact" class="contact">

          <p class="eyebrow">
            Contact
          </p>

          <h2>
            ${esc(block.title).replace(/\n/g,"<br>")}
          </h2>

          <a
            class="email"
            href="mailto:${esc(block.email)}">

            ${esc(block.email)}

          </a>

        </section>

      `;

    }

  });

}


/* =========================
   LOAD CONTENT
========================= */

async function load(){

  try{

    const response = await fetch(
  "/content?v=" + Date.now()
    );

    if(!response.ok){
      throw new Error("Could not load content");
    }

    const data = await response.json();

    render(data);

  }

  catch(error){

    console.error(error);

    render(fallback);

  }

}


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
