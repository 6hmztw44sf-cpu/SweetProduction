<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweet Production</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">
  <a href="#top" class="logo">SWEET<span>PRODUCTION</span></a>

  <nav>
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="page"></main>

<footer>
  <span>© Sweet Production</span>
  <span>Stockholm, Sweden</span>
</footer>

<script>

const fallback = {
  settings:{
    bgColor:"#080808",
    textColor:"#f1efe9",
    accentColor:"#f1efe9"
  },
  blocks:[]
};

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function render(content){

  const s=content.settings||fallback.settings;

  document.documentElement.style.setProperty(
    "--bg-color",s.bgColor
  );

  document.documentElement.style.setProperty(
    "--text-color",s.textColor
  );

  document.documentElement.style.setProperty(
    "--accent-color",s.accentColor
  );

  const page=document.getElementById("page");

  page.innerHTML="";

  (content.blocks||[]).forEach(block=>{

    if(block.type==="hero"){
      page.innerHTML+=`
      <section class="hero">
        <div class="hero-bg">
          <div class="glow one"></div>
          <div class="glow two"></div>
          <div class="grain"></div>
        </div>

        <div class="hero-content">
          <p class="eyebrow">${esc(block.location)}</p>
          <h1>${esc(block.title).replace(/\n/g,"<br>")}</h1>
          <a href="#work" class="scroll">Scroll to explore ↓</a>
        </div>
      </section>`;
    }

    if(block.type==="statement"){
      page.innerHTML+=`
      <section class="statement">
        <p class="eyebrow">Sweet Production</p>
        <h2>${esc(block.text).replace(/\n/g,"<br>")}</h2>
      </section>`;
    }

    if(block.type==="text"){
      page.innerHTML+=`
      <section class="custom-text">
        <p>${esc(block.text).replace(/\n/g,"<br>")}</p>
      </section>`;
    }

    if(block.type==="image" && block.src){
      page.innerHTML+=`
      <section class="custom-image">
        <img src="${esc(block.src)}" alt="${esc(block.alt)}">
      </section>`;
    }

    if(block.type==="video" && block.src){

      const ratio=block.ratio==="9:16"
        ? "vertical"
        : "landscape";

      page.innerHTML+=`
      <section class="custom-video ${ratio}">
        <video
          src="${esc(block.src)}"
          ${block.poster?`poster="${esc(block.poster)}"`:""}
          autoplay
          muted
          loop
          playsinline
          controls>
        </video>
      </section>`;
    }

    if(block.type==="projects"){

      let html="";

      (block.projects||[]).forEach(p=>{

        let media="";

        if(p.type==="video" && p.image){
          media=`
          <video
            src="${esc(p.image)}"
            autoplay
            muted
            loop
            playsinline>
          </video>`;
        }else if(p.image){
          media=`<img src="${esc(p.image)}" alt="">`;
        }else{
          media=`<div class="empty-media"></div>`;
        }

        html+=`
        <article class="project">
          <div class="media">${media}</div>
          <div class="meta">
            <strong>${esc(p.title)}</strong>
            <small>${esc(p.category)}</small>
          </div>
        </article>`;
      });

      page.innerHTML+=`
      <section id="work" class="work">
        <div class="section-top">
          <p class="eyebrow">${esc(block.title)}</p>
          <span>${String((block.projects||[]).length).padStart(2,"0")}</span>
        </div>

        <div class="projects">${html}</div>
      </section>`;
    }

    if(block.type==="about"){
      page.innerHTML+=`
      <section id="about" class="about">
        <p class="eyebrow">About</p>
        <h2>${esc(block.title).replace(/\n/g,"<br>")}</h2>
        <p class="about-text">
          ${esc(block.text).replace(/\n/g,"<br>")}
        </p>
      </section>`;
    }

    if(block.type==="contact"){
      page.innerHTML+=`
      <section id="contact" class="contact">
        <p class="eyebrow">Contact</p>
        <h2>${esc(block.title).replace(/\n/g,"<br>")}</h2>

        <a class="email"
          href="mailto:${esc(block.email)}">
          ${esc(block.email)}
        </a>
      </section>`;
    }

  });
}

async function load(){

  try{

    const r=await fetch(
      "content.json?v="+Date.now()
    );

    if(!r.ok) throw new Error();

    render(await r.json());

  }catch(e){

    render(fallback);

  }
}

load();

</script>

</body>
</html>
